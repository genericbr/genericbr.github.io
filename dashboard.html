<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · GenericBR</title>
<link rel="stylesheet" href="/dashboard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/config.js" defer></script>
<script src="/js/api.js" defer></script>
<script src="/js/admin.js" defer></script>
</head>
<body>
<header class="studio-header"><a class="brand" href="/">GenericBR<small>Admin</small></a><div class="header-actions"><a href="/" target="_blank" rel="noopener">Ver site ↗</a><button id="logout" class="secondary" hidden>Sair</button></div></header>
<main>
<section id="login-section" class="login-card"><h1>Editar portfólio</h1><form id="login-form"><label for="admin-password">Senha de administrador</label><input type="password" id="admin-password" autocomplete="current-password" required><button id="login-btn" type="submit">Entrar</button><p id="login-error" class="status" role="alert"></p></form></section>
<section id="admin-content" hidden>
<div class="page-heading"><div><h1>Painel do portfólio</h1><p class="muted">Gerencie jogos, músicas, audiovisuais e banners.</p></div><button id="refresh" class="secondary">↻ Atualizar cache</button></div>
<nav class="tabs" aria-label="Categorias"><button data-tab="games" aria-current="page">Jogos</button><button data-tab="banners">Banners</button><button data-tab="music">Músicas</button><button data-tab="audiovisuals">Audiovisuais</button></nav>
<div class="toolbar"><div><h2 id="section-title">Jogos</h2><span id="admin-count" class="admin-count"></span><p id="section-description" class="muted"></p></div><button id="add-item">+ Novo jogo</button></div>
<label class="admin-search-label">Buscar nesta categoria<input type="search" id="admin-search" placeholder="Nome ou ID do projeto…"></label><div id="notice" class="notice" role="status" hidden></div>
<div id="editor-list" class="editor-grid" aria-live="polite"></div><p id="admin-no-results" class="state" hidden>Nenhum projeto corresponde à busca.</p>
</section>
</main>
<footer>GenericBR <span>·</span> Painel de edição.</footer>
<dialog id="import-dialog"><form id="import-form"><button class="dialog-close secondary" type="button" aria-label="Fechar">×</button><p class="eyebrow">IMPORTAR DO YOUTUBE</p><h2>Novo projeto</h2><label for="video-url">URL do vídeo</label><input id="video-url" type="url" placeholder="https://www.youtube.com/watch?v=…" required><p class="muted">Busca título, capa e informações do vídeo automaticamente.</p><button type="submit">Buscar e adicionar</button><p class="status" role="status"></p></form></dialog>
</body>
</html>
